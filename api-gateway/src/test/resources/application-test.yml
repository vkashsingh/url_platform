spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        - id: url-service-api
          uri: http://localhost:8082
          predicates:
            - Path=/api/urls/**

        - id: url-service-redirect
          uri: http://localhost:8082
          predicates:
            - Path=/{shortCode}
